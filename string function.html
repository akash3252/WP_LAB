<!DOCTYPE html>
<html>
<head>
  <title>String and Number Operations</title>
</head>
<body>
  <h2>String and Number Operations</h2>

  <label>Enter a string:</label><br>
  <input type="text" id="str1"><br><br>

  <label>Enter number:</label><br>
  <input type="text" id="id1"><br><br>

  <label>Enter power:</label><br>
  <input type="text" id="id2"><br><br>

  <button onclick="add()">Get Result</button>
  <br><br>

  <label>Length of the String:</label><br>
  <input type="text" id="strlen"><br><br>

  <label>Slice String (from index 5 to 10):</label><br>
  <input type="text" id="strsli"><br><br>

  <label><b><u>Power of the number (a^b)</u></b>:</label><br>
  <input type="text" id="ans"><br><br>

  <label><u><b>Square root of the number</b></u>:</label><br>
  <input type="text" id="sqr"><br><br>

  <label><u><b>Ceil of the number</b></u>:</label><br>
  <input type="text" id="ceil"><br><br>

  <label><u><b>Floor of the number</b></u>:</label><br>
  <input type="text" id="floor"><br><br>

  <script>
    function add() {
      // Get values from input fields
      var s = document.getElementById("str1").value;
      var a = parseFloat(document.getElementById("id1").value);
      var b = parseFloat(document.getElementById("id2").value);

      // Perform string operations
      var sl = s.length;
      var sli = s.slice(5, 11); // slice from index 5 to 10

      // Perform math operations
      var c = Math.pow(a, b);
      var n = Math.sqrt(a);
      var m = Math.ceil(a);
      var i = Math.floor(a);

      // Display results
      document.getElementById("strlen").value = sl;
      document.getElementById("strsli").value = sli;
      document.getElementById("ans").value = c;
      document.getElementById("sqr").value = n;
      document.getElementById("ceil").value = m;
      document.getElementById("floor").value = i;
    }
  </script>
</body>
</html>
